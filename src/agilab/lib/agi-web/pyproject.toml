[project]
version = "2026.10.10.1"
name = "agi-web"
description = "AGILAB portable web components with native React Python views and shared analysis components for Jupyter"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "Jean-Pierre Morard" }
]
maintainers = [{ name = "Jean-Pierre Morard" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

keywords = [
    "agilab",
    "web-components",
    "react",
    "webgl",
    "canvas",
    "evidence",
]

dependencies = []

[project.optional-dependencies]
notebook = ["anywidget>=0.9.18,<1"]

[project.urls]
Documentation = "https://thalesgroup.github.io/agilab"
Source = "https://github.com/ThalesGroup/agilab/tree/main/src/agilab/lib/agi-web"
Issues = "https://github.com/ThalesGroup/agilab/issues"
Homepage = "https://github.com/ThalesGroup/agilab"
Repository = "https://github.com/ThalesGroup/agilab"
Discussions = "https://github.com/ThalesGroup/agilab/discussions"
Changelog = "https://github.com/ThalesGroup/agilab/releases"




[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
packages = ["agi_web"]

[tool.setuptools.package-data]
agi_web = ["react_analysis_assets/*.js", "react_analysis_assets/*.css", "react_analysis_assets/*.LICENSE.txt", "react_main_interface_assets/*.js", "react_main_interface_assets/*.css", "react_main_interface_assets/*.LICENSE.txt", "react_python_host_assets/*.js", "react_python_host_assets/*.css", "react_python_host_assets/*.LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.agilab.generated-sources.public-bind-guard]
canonical = "../../security/ui_public_bind_guard.py"
destination = "src/agi_web/public_bind_guard.py"
generator = "../../../../tools/generate_agilab_portable_public_bind_guard.py"
