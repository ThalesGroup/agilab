[project]
version = "2026.10.04"
name = "agi-app-r-runtime-bridge"
description = "Built-in AGILAB Rscript JSON and artifact stage bridge"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "Jean-Pierre Morard" }
]
maintainers = [{ name = "Jean-Pierre Morard" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

keywords = [
    "agilab",
    "apps",
    "reproducibility",
    "workflow-orchestration",
]

dependencies = ["agi-env>=2026.10.04,<2027.0", "agi-node>=2026.10.04,<2027.0", "agi-web>=2026.10.04,<2027.0"]

[project.urls]
Documentation = "https://thalesgroup.github.io/agilab"
Source = "https://github.com/ThalesGroup/agilab/tree/main/src/agilab/lib/agi-app-r-runtime-bridge"
Issues = "https://github.com/ThalesGroup/agilab/issues"
Homepage = "https://github.com/ThalesGroup/agilab"
Repository = "https://github.com/ThalesGroup/agilab"
Discussions = "https://github.com/ThalesGroup/agilab/discussions"
Changelog = "https://github.com/ThalesGroup/agilab/releases"

[project.entry-points."agilab.apps"]
r_runtime_bridge = "agi_app_r_runtime_bridge:project_root"
r_runtime_bridge_project = "agi_app_r_runtime_bridge:project_root"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.sources.agi-env]
    path = "../../core/agi-env"
    editable = true

[tool.uv.sources.agi-node]
    path = "../../core/agi-node"
    editable = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
packages = ["agi_app_r_runtime_bridge"]

[tool.setuptools.package-data]
"agi_app_r_runtime_bridge" = [
    "project/**/*",
]

[tool.setuptools.exclude-package-data]
"agi_app_r_runtime_bridge" = [
    "project/**/.venv/**",
    "project/**/__pycache__/**",
    "project/**/*.pyc",
    "project/**/*.pyo",
    "project/**/*.pyx",
    "project/**/*.c",
    "project/**/*.so",
    "project/**/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["test"]
