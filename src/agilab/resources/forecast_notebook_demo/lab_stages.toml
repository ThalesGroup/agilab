n        \"horizon\": result[\"horizon\"],\\n        \"seed\": result[\"seed\"],\\n    }\\n}\\n\\nwith open(\"results.json\", \"w\") as f:\\n    json.dump(output, f, indent=2)\\n\\nprint(\"Wrote results.json\")\\nprint(json.dumps(output, indent=2))\\n', 'notebook:cell-3')])\n"
