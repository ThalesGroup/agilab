<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1140" viewBox="0 0 1230 1140" role="img" aria-labelledby="title desc">
<title id="title">Paysage ML : huit questions complémentaires pour choisir et évaluer</title>
<desc id="desc">Une grille distingue tâche, signal, algorithme, représentation, ensemble, adaptation, entraînement et évaluation. Ces axes se combinent : une forêt aléatoire peut estimer le risque d’interruption d’une liaison réseau sur un horizon défini. Les modèles probabilistes et neuronaux ne sont pas des régimes d’apprentissage exclusifs.</desc>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1230" height="1140" fill="white"/><text x="36" y="48" font-size="34" fill="#18334b" font-weight="700"><tspan x="36" dy="0">Le paysage ML : huit questions qui se combinent</tspan></text><text x="36" y="89" font-size="25" fill="#18334b" font-weight="400"><tspan x="36" dy="0">Ces cases ne sont ni des branches exclusives ni un classement de performance.</tspan></text><g id="task"><rect x="30" y="119" width="565" height="195" rx="12" fill="#eff7fb" stroke="#c5d4dc" stroke-width="2"/><text x="51" y="155" font-size="25" fill="#18334b" font-weight="700"><tspan x="51" dy="0">1 · Quel résultat cherche-t-on ?</tspan></text><text x="51" y="196" font-size="23" fill="#18334b" font-weight="400"><tspan x="51" dy="0">Classification : une classe ou un risque</tspan><tspan x="51" dy="33">Régression : une valeur continue</tspan><tspan x="51" dy="33">Regroupement : des groupes à explorer</tspan><tspan x="51" dy="33">Représentation : des variables utiles</tspan></text></g><g id="signal"><rect x="635" y="119" width="565" height="195" rx="12" fill="#f0f8f3" stroke="#c5d4dc" stroke-width="2"/><text x="656" y="155" font-size="25" fill="#18334b" font-weight="700"><tspan x="656" dy="0">2 · Quel signal d’apprentissage ?</tspan></text><text x="656" y="196" font-size="23" fill="#18334b" font-weight="400"><tspan x="656" dy="0">Supervisé : des cibles fournies</tspan><tspan x="656" dy="33">Non supervisé : la structure des données</tspan><tspan x="656" dy="33">Auto-supervisé : une cible construite</tspan><tspan x="656" dy="33">Semi-supervisé ; renforcement (retour)</tspan></text></g><g id="models"><rect x="30" y="335" width="565" height="195" rx="12" fill="#eff7fb" stroke="#c5d4dc" stroke-width="2"/><text x="51" y="371" font-size="25" fill="#18334b" font-weight="700"><tspan x="51" dy="0">3 · Quel algorithme de base ?</tspan></text><text x="51" y="412" font-size="23" fill="#18334b" font-weight="400"><tspan x="51" dy="0">Régressions, Ridge/Lasso, KNN, SVM/SVR</tspan><tspan x="51" dy="33">Arbre ; K-means, hiérarchie, DBSCAN</tspan><tspan x="51" dy="33">Naive Bayes, réseau bayésien, GMM, HMM</tspan><tspan x="51" dy="33">Le choix dépend des données et de la tâche.</tspan></text></g><g id="representation"><rect x="635" y="335" width="565" height="195" rx="12" fill="#f0f8f3" stroke="#c5d4dc" stroke-width="2"/><text x="656" y="371" font-size="25" fill="#18334b" font-weight="700"><tspan x="656" dy="0">4 · Quelle représentation ?</tspan></text><text x="656" y="412" font-size="23" fill="#18334b" font-weight="400"><tspan x="656" dy="0">PCA, t-SNE, UMAP : réduire la dimension</tspan><tspan x="656" dy="33">Autoencodeur ; plongements, Word2Vec</tspan><tspan x="656" dy="33">Apprentissage contrastif et profond</tspan><tspan x="656" dy="33">Architectures : MLP, CNN, RNN, transformeur</tspan></text></g><g id="ensemble"><rect x="30" y="551" width="565" height="195" rx="12" fill="#eff7fb" stroke="#c5d4dc" stroke-width="2"/><text x="51" y="587" font-size="25" fill="#18334b" font-weight="700"><tspan x="51" dy="0">5 · Comment combiner les modèles ?</tspan></text><text x="51" y="628" font-size="23" fill="#18334b" font-weight="400"><tspan x="51" dy="0">Bagging → forêt aléatoire</tspan><tspan x="51" dy="33">Boosting → AdaBoost, gradient boosting</tspan><tspan x="51" dy="33">XGBoost, LightGBM, CatBoost : outils</tspan><tspan x="51" dy="33">Stacking : apprendre la combinaison</tspan></text></g><g id="adaptation"><rect x="635" y="551" width="565" height="195" rx="12" fill="#f0f8f3" stroke="#c5d4dc" stroke-width="2"/><text x="656" y="587" font-size="25" fill="#18334b" font-weight="700"><tspan x="656" dy="0">6 · Comment réutiliser ou adapter ?</tspan></text><text x="656" y="628" font-size="23" fill="#18334b" font-weight="400"><tspan x="656" dy="0">Transfert : réutiliser des paramètres</tspan><tspan x="656" dy="33">Actif : choisir les exemples à annoter</tspan><tspan x="656" dy="33">Méta-apprentissage : apprendre à adapter</tspan><tspan x="656" dy="33">Attention au décalage entre domaines.</tspan></text></g><g id="training"><rect x="30" y="767" width="565" height="195" rx="12" fill="#eff7fb" stroke="#c5d4dc" stroke-width="2"/><text x="51" y="803" font-size="25" fill="#18334b" font-weight="700"><tspan x="51" dy="0">7 · Comment entraîner ?</tspan></text><text x="51" y="844" font-size="23" fill="#18334b" font-weight="400"><tspan x="51" dy="0">Descente de gradient ; SGD</tspan><tspan x="51" dy="33">Adam, RMSprop ; taux d’apprentissage</tspan><tspan x="51" dy="33">Régularisation : L1/L2, dropout</tspan><tspan x="51" dy="33">Arrêt anticipé ; budget de calcul</tspan></text></g><g id="evaluation"><rect x="635" y="767" width="565" height="195" rx="12" fill="#f0f8f3" stroke="#c5d4dc" stroke-width="2"/><text x="656" y="803" font-size="25" fill="#18334b" font-weight="700"><tspan x="656" dy="0">8 · Comment évaluer le modèle ?</tspan></text><text x="656" y="844" font-size="23" fill="#18334b" font-weight="400"><tspan x="656" dy="0">Entraînement / validation / test</tspan><tspan x="656" dy="33">Validation croisée sans fuite de données</tspan><tspan x="656" dy="33">Matrice de confusion ; F1, RMSE, AUC</tspan><tspan x="656" dy="33">Exactitude ; biais–variance ; coût des erreurs</tspan></text></g><g id="worked-example"><rect x="30" y="997" width="1170" height="121" rx="12" fill="#fff6e8" stroke="#aa7733" stroke-width="2"/><text x="51" y="1030" font-size="25" fill="#18334b" font-weight="700"><tspan x="51" dy="0">Exemple · Estimer le risque d’interruption d’une liaison réseau</tspan></text><text x="51" y="1066" font-size="25" fill="#18334b" font-weight="400"><tspan x="51" dy="0">Cible : interruption dans les 5 prochaines minutes.</tspan></text><text x="51" y="1099" font-size="24" fill="#18334b" font-weight="400"><tspan x="51" dy="0">Classification supervisée + arbres + bagging → forêt aléatoire.</tspan></text></g></g></svg>
