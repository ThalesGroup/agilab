  <title id="density-title">Densité uniforme : la probabilité correspond à une aire</title>
  <desc id="density-desc">Un délai uniforme entre zéro et une demi-seconde a une densité de deux secondes inverses. La zone entre 0,1 et 0,2 seconde a une aire de 0,2, soit une probabilité de 20 pour cent. La hauteur peut dépasser un ; l’aire totale vaut un.</desc>
