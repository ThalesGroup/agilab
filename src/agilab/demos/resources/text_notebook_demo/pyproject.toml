[project]
name = "text-atlas"
version = "0.1.0"
description = "Text Atlas – dimensionality reduction of the Wikinews corpus"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.3,<4",
    "scikit-learn>=1.6,<2",
    "agi-web>=2026.07.17,<2027.0",
    "altair>=5,<7",
    "threadpoolctl>=3,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources.agi-web]
path = "../../../lib/agi-web"
editable = true
