requires-python = ">=3.12"
dependencies = ["agi-web>=2026.07.17,<2027.0", "altair>=6,<7", "numpy>=2.3,<3", "pandas>=2.3,<3", "pypsa>=1.2.4,<1.3", "highspy>=1.15.1,<1.16", "linopy>=0.9.1,<0.10"]

[project.optional-dependencies]
