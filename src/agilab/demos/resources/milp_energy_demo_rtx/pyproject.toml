[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milp-modular-unit-commitment"
version = "0.1.0"
description = "Modular expansion with unit commitment (MILP) analysis with PyPSA/HiGHS and a React UI"
requires-python = ">=3.12"
license = { text = "CC-BY-4.0" }
dependencies = [
    "pypsa",
    "linopy",
    "highspy",
    "pandas",
    "numpy",
    "matplotlib",
    "agi-web>=2026.07.17,<2027.0",
]

[tool.setuptools]
py-modules = ["milp_analysis", "app", "energy_core", "energy_runner", "agilab_pool"]

[tool.uv.sources.agi-web]
path = "../../../lib/agi-web"
editable = true
