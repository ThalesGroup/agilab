[project]
name = "milp-energy-lab"
version = "1.0.0"
description = "An interactive, independently checked modular energy MILP and AGILAB batch lab"
requires-python = ">=3.11"
readme = "README.md"
license = "CC-BY-4.0 AND BSD-3-Clause"
dependencies = [
  "pypsa==1.2.4",
  "highspy==1.15.1",
  "linopy==0.9.1",
  "streamlit>=1.57,<2",
  "pandas>=2.3,<3",
  "numpy>=2.3,<3",
  "altair>=6,<7",
  "psutil>=7,<8",
]

[tool.setuptools]
py-modules = ["energy_core", "energy_runner", "app", "agilab_pool"]
