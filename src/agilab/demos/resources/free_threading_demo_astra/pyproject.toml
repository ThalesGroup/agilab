[project]
name = "agilab-free-threading-lab"
version = "0.1.0"
description = "Truthful local CPU scaling with the unchanged AGILAB pool engine"
requires-python = ">=3.13"
dependencies = ["agi-web>=2026.07.17,<2027.0", "altair>=6,<7", "Pillow>=12,<13"]
license = "BSD-3-Clause"

[tool.setuptools]
py-modules = ["app", "benchmark", "free_threading_core", "agilab_pool"]

[tool.uv.sources.agi-web]
path = "../../../lib/agi-web"
editable = true
