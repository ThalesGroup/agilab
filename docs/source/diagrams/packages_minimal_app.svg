<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="321" viewBox="0 0 1084 321" role="img" aria-labelledby="title desc">
  <title id="title">minimal_app package layout</title>
  <desc id="desc">The smallest AGILAB app: a manager package, typed arguments, and a Streamlit form.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0e223f; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536984; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-note { font-size: 13px; fill: #536984; }
      .member { font-size: 13px; }
      .count { font-size: 12px; font-weight: 700; fill: #70849c; }
      .footer { font-size: 13px; fill: #536984; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#edf3fb" />
    </linearGradient>
  </defs>
  <rect width="1084" height="321" fill="url(#bg)" rx="28" ry="28" />
  <text class="title" x="46" y="52">minimal_app package layout</text>
  <text class="subtitle" x="46" y="80">The smallest AGILAB app: a manager package, typed arguments, and a Streamlit form.</text>
  <rect x="46" y="104" width="316" height="119" rx="18" ry="18" fill="#d9f0ff" stroke="#0e223f" stroke-width="2" />
  <text class="card-title" x="66" y="134">Manager</text>
  <text class="count" x="342" y="134" text-anchor="end">1 module</text>
  <text class="card-note" x="66" y="156">BaseWorker subclass that builds the</text>
  <text class="card-note" x="66" y="176">work plan.</text>
  <text class="member" x="66" y="200">minimal_app</text>
  <rect x="384" y="104" width="316" height="119" rx="18" ry="18" fill="#e3dcff" stroke="#0e223f" stroke-width="2" />
  <text class="card-title" x="404" y="134">Arguments</text>
  <text class="count" x="680" y="134" text-anchor="end">2 modules</text>
