name: coverage-badge-public-status

on:
  workflow_run:
    workflows: ["coverage"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-badge-public-status-main
  cancel-in-progress: true

jobs:
  verify-public-badge:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # workflow_run must execute trusted default-branch tooling, never a
      # triggering PR checkout or an executable artifact from another run.
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Compare the published badge with the completed coverage run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python tools/coverage_badge_guard.py --check-public-workflow --workflow-run-id "$EXPECTED_RUN_ID"
