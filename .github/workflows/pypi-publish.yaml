name: pypi-publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag only; distribution versions are read from pyproject.toml."
        required: true
      packages:
        description: "Optional comma- or space-separated package names to publish. Default: all."
        required: false
      first_publish_packages:
        description: "Optional package/PyPI names whose missing projects are expected after pending trusted publisher registration."
        required: false
      roles:
        description: "Optional comma- or space-separated package roles to publish. Default: all."
        required: false
      impact_base_ref:
        description: "Optional git ref used to publish only changed packages plus exact-pin dependents. Ignored when packages or roles are set."
        required: false
      release_mode:
        description: "Release intent: stable=YYYY.MM.DD, hotfix=package YYYY.MM.DD.N with release tag vYYYY.MM.DD_N, candidate=YYYY.MM.DDrcN, repair=no PyPI distributions."
        required: false
        type: choice
        default: stable
        options:
          - stable
          - hotfix
          - candidate
          - repair
      include_existing_pypi:
        description: "Include package versions that already exist on PyPI to repair release assets. Default skips them."
        required: false
        type: boolean
        default: false
      pypi_retention_min_published_releases:
        description: "Minimum visible PyPI releases before retention prunes older releases."
        required: false
        type: string
        default: "11"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PYPI_RETENTION_MIN_PUBLISHED_RELEASES: ${{ github.event.inputs.pypi_retention_min_published_releases || vars.PYPI_RETENTION_MIN_PUBLISHED_RELEASES || '11' }}

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Run strict AGILAB audit review
        env:
          RELEASE_PACKAGES: ${{ github.event.inputs.packages || '' }}
          FIRST_PUBLISH_PACKAGES: ${{ github.event.inputs.first_publish_packages || '' }}
          RELEASE_ROLES: ${{ github.event.inputs.roles || '' }}
        run: |
          set -euxo pipefail
          audit_args=(--strict)
          if [ -n "${RELEASE_PACKAGES:-}" ]; then
            audit_args+=(--pypi-package "$RELEASE_PACKAGES")
          fi
          if [ -n "${FIRST_PUBLISH_PACKAGES:-}" ]; then
            audit_args+=(--allow-missing-pypi-project "$FIRST_PUBLISH_PACKAGES")
          fi
          if [ -n "${RELEASE_ROLES:-}" ]; then
            audit_args+=(--pypi-role "$RELEASE_ROLES")
          fi
          uv --preview-features extra-build-dependencies run python tools/agilab_audit.py "${audit_args[@]}"

      - name: Fail on accidental O.* version typos in published packages
        run: |
          set -euxo pipefail
          if grep -R --line-number '^[[:space:]]*version[[:space:]]*=[[:space:]]*"O\.' src/agilab/core src/agilab/lib; then
            echo "❌ Found bad version lines (capital O). Fix the source metadata before release." >&2
            exit 1
          fi

  test:
    needs:
      - release-audit
      - release-plan
    if: ${{ needs.release-plan.outputs.pypi_publish_selected == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Resolve Playwright version for browser cache key
        id: playwright-version
        run: |
          set -euxo pipefail
          version="$(uv --preview-features extra-build-dependencies run --with playwright python -c 'from importlib.metadata import version; print(version("playwright"))')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          # Exact-key only: the key tracks the resolved Playwright version, so a
          # version bump rolls to a fresh cache instead of restoring stale
          # browser revisions and unioning them into ever-growing saves.
          key: playwright-${{ runner.os }}-py${{ matrix.python-version }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browser for frontend smoke
        run: |
          set -euxo pipefail
          uv --preview-features extra-build-dependencies run --with "playwright==${{ steps.playwright-version.outputs.version }}" python -m playwright install --with-deps chromium

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-py${{ matrix.python-version }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Run release preflight tests
        run: |
          set -eux
          uv --preview-features extra-build-dependencies run python tools/workflow_parity.py \
            --profile agi-env \
            --profile agi-gui \
            --profile ui-frontend-smoke \
            --profile agi-core-combined \
            --profile shared-core-typing \
            --profile dependency-policy \
            --profile release-proof


  release-evidence:
    needs:
      - release-plan
      - test
    if: ${{ !cancelled() && needs.release-plan.outputs.pypi_publish_selected == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Build sample external evidence payload
        run: |
          set -euxo pipefail
          uv --preview-features extra-build-dependencies run \
            python tools/github_actions_artifact_index.py \
            --write-sample-directory "$RUNNER_TEMP/public-evidence-sample" \
            --compact

      - name: Upload sample external evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-evidence-sample
          path: ${{ runner.temp }}/public-evidence-sample
          if-no-files-found: error
          retention-days: 7

      - name: Validate live GitHub Actions artifact harvest path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if uv --preview-features extra-build-dependencies run \
              python tools/github_actions_artifact_index.py \
              --live-github \
              --repo "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --workflow "$GITHUB_WORKFLOW" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --source-machine "github-actions:${RUNNER_OS}-${RUNNER_ARCH}" \
              --download-dir "$RUNNER_TEMP/downloaded-evidence" \
              --output "$RUNNER_TEMP/artifact_index.json" \
              --compact; then
              if uv --preview-features extra-build-dependencies run \
                python tools/ci_artifact_harvest_report.py \
                --artifact-index "$RUNNER_TEMP/artifact_index.json" \
                --compact; then
                break
              fi
            fi
            if [ "$attempt" = "6" ]; then
              exit 1
            fi
            sleep 5
          done
          uv --preview-features extra-build-dependencies run \
            python tools/compatibility_report.py \
            --artifact-index "$RUNNER_TEMP/artifact_index.json" \
            --no-default-manifests \
            --compact

  supply-chain-evidence:
    needs:
      - release-plan
      - test
    if: ${{ !cancelled() && needs.release-plan.outputs.pypi_publish_selected == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Generate per-profile SBOM and vulnerability evidence
        run: |
          set -euxo pipefail
          mkdir -p test-results/supply-chain
          uv --preview-features extra-build-dependencies run \
            python tools/profile_supply_chain_scan.py \
            --profile all \
            --output-dir test-results/supply-chain \
            --json > test-results/supply-chain/scan-plan.json
          uv --preview-features extra-build-dependencies run \
            python tools/profile_supply_chain_scan.py \
            --profile all \
            --output-dir test-results/supply-chain \
            --run

      - name: Upload supply-chain release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-release-evidence
          path: test-results/supply-chain
          if-no-files-found: error
          retention-days: 90

  release-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      library_matrix: ${{ steps.release-plan.outputs.library_matrix }}
      umbrella_package: ${{ steps.release-plan.outputs.umbrella_package }}
      library_selected: ${{ steps.release-plan.outputs.library_selected }}
      umbrella_selected: ${{ steps.release-plan.outputs.umbrella_selected }}
      pypi_publish_selected: ${{ steps.release-plan.outputs.pypi_publish_selected }}
      pypi_existing_packages: ${{ steps.release-plan.outputs.pypi_existing_packages }}
      provenance_packages: ${{ steps.release-plan.outputs.provenance_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up locked release-plan dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-publish.txt

      - name: Render release package plan
        id: release-plan
        env:
          RELEASE_PACKAGES: ${{ github.event.inputs.packages || '' }}
          RELEASE_ROLES: ${{ github.event.inputs.roles || '' }}
          RELEASE_IMPACT_BASE_REF: ${{ github.event.inputs.impact_base_ref || '' }}
          INCLUDE_EXISTING_PYPI: ${{ github.event.inputs.include_existing_pypi || 'false' }}
        run: |
          set -euxo pipefail
          args=(
            --repo-root .
            --github-output "$GITHUB_OUTPUT"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
            --check-workflow .github/workflows/pypi-publish.yaml
          )
          if [ "${INCLUDE_EXISTING_PYPI:-false}" != "true" ]; then
            args+=(--skip-existing-pypi)
          fi
          if [ -n "${RELEASE_PACKAGES:-}" ]; then
            args+=(--packages "$RELEASE_PACKAGES")
          fi
          if [ -n "${RELEASE_ROLES:-}" ]; then
            args+=(--roles "$RELEASE_ROLES")
          fi
          if [ -n "${RELEASE_IMPACT_BASE_REF:-}" ] && [ -z "${RELEASE_PACKAGES:-}" ] && [ -z "${RELEASE_ROLES:-}" ]; then
            args+=(--impact-base-ref "$RELEASE_IMPACT_BASE_REF")
          fi
          python tools/release_plan.py "${args[@]}"

      - name: Validate release tag namespace
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG#refs/tags/}"
          if [[ "$release_tag" != v* ]]; then
            release_tag="v${release_tag}"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}([._]?[A-Za-z0-9]+)?(-[0-9]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 2
          fi

      - name: Validate managed docs release tag before publication
        if: steps.release-plan.outputs.pypi_publish_selected == 'true'
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG#refs/tags/}"
          if [[ "$release_tag" != v* ]]; then
            release_tag="v${release_tag}"
          fi
          RELEASE_TAG_NORMALIZED="$release_tag" python - <<'PY'
          import os

          from tools import pypi_publish

          pypi_publish.assert_public_docs_index_release_link(
              os.environ["RELEASE_TAG_NORMALIZED"]
          )
          PY

      - name: Render PyPI trusted publisher contract
        run: |
          set -euxo pipefail
          python tools/pypi_trusted_publisher_contract.py \
            --check-workflow .github/workflows/pypi-publish.yaml \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Validate public release cadence policy
        env:
          RELEASE_PACKAGES: ${{ github.event.inputs.packages || '' }}
          RELEASE_ROLES: ${{ github.event.inputs.roles || '' }}
          RELEASE_IMPACT_BASE_REF: ${{ github.event.inputs.impact_base_ref || '' }}
          INCLUDE_EXISTING_PYPI: ${{ github.event.inputs.include_existing_pypi || 'false' }}
          RELEASE_MODE: ${{ github.event.inputs.release_mode || 'stable' }}
        run: |
          set -euxo pipefail
          args=(--repo-root . --github-step-summary "$GITHUB_STEP_SUMMARY")
          if [ "${INCLUDE_EXISTING_PYPI:-false}" != "true" ]; then
            args+=(--skip-existing-pypi)
          fi
          if [ -n "${RELEASE_PACKAGES:-}" ]; then
            args+=(--packages "$RELEASE_PACKAGES")
          fi
          if [ -n "${RELEASE_ROLES:-}" ]; then
            args+=(--roles "$RELEASE_ROLES")
          fi
          if [ -n "${RELEASE_IMPACT_BASE_REF:-}" ] && [ -z "${RELEASE_PACKAGES:-}" ] && [ -z "${RELEASE_ROLES:-}" ]; then
            args+=(--impact-base-ref "$RELEASE_IMPACT_BASE_REF")
          fi
          args+=(--release-mode "$RELEASE_MODE")
          python tools/pypi_release_version_policy.py "${args[@]}"

  # One human approval gates every externally mutating release job. Individual
  # package environments retain their PyPI OIDC identity and ref restrictions,
  # while this dedicated environment avoids asking for the same approval once
  # per package in the publish matrix.
  release-approval:
    needs:
      - release-audit
      - release-plan
      - test
      - release-evidence
      - supply-chain-evidence
    if: ${{ !cancelled() && needs.release-audit.result == 'success' && needs.release-plan.result == 'success' && (needs.release-plan.outputs.pypi_publish_selected != 'true' || (needs.test.result == 'success' && needs.release-evidence.result == 'success' && needs.supply-chain-evidence.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-release-approval
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.release_tag || github.ref_name }}
    permissions: {}
    steps:
      - name: Record approved release boundary
        run: echo "Release publication evidence approved for ${GITHUB_REF_NAME}."

  build-library-packages:
    needs:
      - test
      - release-evidence
      - supply-chain-evidence
      - release-plan
    if: ${{ !cancelled() && needs.release-plan.result == 'success' && needs.release-plan.outputs.library_selected == 'true' && ((needs.test.result == 'success' && needs.release-evidence.result == 'success' && needs.supply-chain-evidence.result == 'success') || needs.release-plan.outputs.pypi_publish_selected != 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-plan.outputs.library_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up locked publishing dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-publish.txt

      - name: Check whether ${{ matrix.package }} can reuse PyPI artifacts
        id: library-pypi-reuse
        if: matrix.publish_to_pypi == 'true'
        run: |
          set -euxo pipefail
          python tools/pypi_distribution_state.py \
            --package "${{ matrix.package }}" \
            --project "${{ matrix.project }}" \
            --artifact-policy "${{ matrix.artifact_policy }}" \
            --github-output "$GITHUB_OUTPUT" \
            --output-dir "test-results/release-artifacts/${{ matrix.package }}" \
            --output-prefix "${{ matrix.package }}" \
            --download-dir "${{ matrix.dist }}"

      - name: Clean previous ${{ matrix.package }} build
        if: matrix.publish_to_pypi != 'true' || steps.library-pypi-reuse.outputs.all-exist != 'true'
        run: rm -rf "${{ matrix.dist }}"

      - name: Build ${{ matrix.package }}
        if: matrix.publish_to_pypi != 'true' || steps.library-pypi-reuse.outputs.all-exist != 'true'
        run: |
          set -euxo pipefail
          if [ "${{ matrix.artifact_policy }}" = "wheel-only" ]; then
            uv --preview-features extra-build-dependencies build --project "${{ matrix.project }}" --wheel
          else
            uv --preview-features extra-build-dependencies build --project "${{ matrix.project }}"
          fi

      - name: Verify ${{ matrix.package }}
        if: matrix.publish_to_pypi != 'true' || steps.library-pypi-reuse.outputs.all-exist != 'true'
        run: twine check "${{ matrix.dist }}"/*

      - name: Record ${{ matrix.package }} release artifact hashes
        if: matrix.publish_to_pypi != 'true' || steps.library-pypi-reuse.outputs.all-exist != 'true'
        run: |
          set -euxo pipefail
          python tools/release_artifact_manifest.py \
            --dist-dir "${{ matrix.dist }}" \
            --package "${{ matrix.package }}" \
            --artifact-policy "${{ matrix.artifact_policy }}" \
            --output-dir "test-results/release-artifacts/${{ matrix.package }}" \
            --output-prefix "${{ matrix.package }}"

      - name: Check whether ${{ matrix.package }} distributions already exist on PyPI
        id: library-pypi-state
        if: matrix.publish_to_pypi == 'true' && steps.library-pypi-reuse.outputs.all-exist != 'true'
        run: |
          set -euxo pipefail
          python tools/pypi_distribution_state.py \
            --dist-dir "${{ matrix.dist }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.package }} public release distribution evidence
        if: matrix.publish_to_pypi == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist-${{ matrix.package }}
          path: |
            ${{ matrix.dist }}/*
            test-results/release-artifacts/${{ matrix.package }}/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Upload ${{ matrix.package }} workflow-only distribution evidence
        if: matrix.publish_to_pypi != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-dist-${{ matrix.package }}
          path: |
            ${{ matrix.dist }}/*
            test-results/release-artifacts/${{ matrix.package }}/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Report trusted publisher claim for ${{ matrix.package }}
        if: steps.library-pypi-reuse.outputs.all-exist != 'true' && steps.library-pypi-state.outputs.all-exist != 'true' && matrix.publish_to_pypi == 'true'
        run: |
          set -euxo pipefail
          python tools/pypi_trusted_publisher_contract.py \
            --package "${{ matrix.package }}" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  # PyPI OIDC tokens are project-scoped. The matrix gives each PyPI project a
  # distinct GitHub environment claim. This job consumes only an immutable,
  # exact-name artifact from the current workflow run; it never checks out or
  # executes repository code while OIDC is available.
  publish-library-packages:
    needs:
      - release-approval
      - release-plan
      - build-library-packages
    if: ${{ !cancelled() && needs.release-approval.result == 'success' && needs.release-plan.outputs.library_selected == 'true' && needs.build-library-packages.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-plan.outputs.library_matrix) }}
    environment:
      name: ${{ matrix.pypi_environment }}
      url: https://pypi.org/project/${{ matrix.pypi_project }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable ${{ matrix.package }} distribution artifact
        if: matrix.publish_to_pypi == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ matrix.package }}
          path: publish-artifact

      - name: Publish ${{ matrix.package }} to PyPI with trusted publishing
        if: matrix.publish_to_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: publish-artifact/${{ matrix.dist }}
          print-hash: true
          skip-existing: true

  build-agilab:
    if: ${{ !cancelled() && needs.release-plan.outputs.umbrella_selected == 'true' && needs.test.result == 'success' && needs.release-evidence.result == 'success' && needs.supply-chain-evidence.result == 'success' }}
    needs:
      - test
      - release-evidence
      - supply-chain-evidence
      - release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up locked publishing dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-publish.txt

      - name: Check whether agilab can reuse PyPI artifacts
        id: agilab-pypi-reuse
        run: |
          set -euxo pipefail
          python tools/pypi_distribution_state.py \
            --package agilab \
            --project . \
            --artifact-policy wheel+sdist \
            --github-output "$GITHUB_OUTPUT" \
            --output-dir test-results/release-artifacts/agilab \
            --output-prefix agilab \
            --download-dir dist

      - name: Clean previous builds
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true'
        run: rm -rf dist

      - name: Remove symlinks (apps/ and views/)
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          find src/agilab/apps src/agilab/views -type l -print -delete || true

      - name: Build agilab
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true'
        run: uv --preview-features extra-build-dependencies build

      - name: Verify agilab
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true'
        run: twine check dist/*

      - name: Record agilab release artifact hashes
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true'
        run: |
          set -euxo pipefail
          python tools/release_artifact_manifest.py \
            --dist-dir dist \
            --package agilab \
            --artifact-policy wheel+sdist \
            --output-dir test-results/release-artifacts/agilab \
            --output-prefix agilab

      - name: Check whether agilab distribution already exists on PyPI
        id: agilab-pypi-state
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true'
        run: |
          set -euxo pipefail
          python tools/pypi_distribution_state.py \
            --dist-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload agilab release distribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist-agilab
          path: |
            dist/*
            test-results/release-artifacts/agilab/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Report trusted publisher claim for agilab
        if: steps.agilab-pypi-reuse.outputs.all-exist != 'true' && steps.agilab-pypi-state.outputs.all-exist != 'true'
        run: |
          set -euxo pipefail
          python tools/pypi_trusted_publisher_contract.py \
            --package agilab \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

  # The protected PyPI environment and OIDC permission exist only in this
  # artifact-consumer job. The pinned download action checks the immutable
  # artifact digest before the pinned publisher action uploads distributions.
  publish-agilab:
    if: ${{ !cancelled() && needs.release-approval.result == 'success' && needs.release-plan.outputs.umbrella_selected == 'true' && needs.build-agilab.result == 'success' && (needs.publish-library-packages.result == 'success' || needs.publish-library-packages.result == 'skipped') }}
    needs:
      - release-approval
      - release-plan
      - build-agilab
      - publish-library-packages
    runs-on: ubuntu-latest
    environment:
      name: pypi-agilab
      url: https://pypi.org/project/agilab/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable agilab distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-agilab
          path: publish-artifact

      - name: Publish agilab to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: publish-artifact/dist/
          print-hash: true
          skip-existing: true

  pypi-provenance-evidence:
    if: ${{ always() && needs.release-plan.outputs.pypi_publish_selected == 'true' && needs.test.result == 'success' && needs.release-evidence.result == 'success' && needs.supply-chain-evidence.result == 'success' && (needs.publish-library-packages.result == 'success' || needs.publish-library-packages.result == 'skipped') && (needs.publish-agilab.result == 'success' || needs.publish-agilab.result == 'skipped') }}
    needs:
      - test
      - release-evidence
      - supply-chain-evidence
      - release-plan
      - publish-library-packages
      - publish-agilab
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROVENANCE_PACKAGES: ${{ needs.release-plan.outputs.provenance_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify published PyPI provenance
        run: |
          set -euxo pipefail
          mkdir -p test-results/pypi-provenance
          args=(
            --json
            --attempts 12
            --retry-delay 10
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )
          for package in ${PROVENANCE_PACKAGES}; do
            args+=(--package "$package")
          done
          python tools/pypi_provenance_check.py "${args[@]}" > test-results/pypi-provenance/pypi-provenance.json

      - name: Upload PyPI provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-provenance-evidence
          path: test-results/pypi-provenance
          if-no-files-found: warn
          retention-days: 90

  publish-release-assets:
    if: ${{ always() && needs.release-approval.result == 'success' && needs.release-plan.outputs.pypi_publish_selected == 'true' && needs.supply-chain-evidence.result == 'success' && needs.pypi-provenance-evidence.result == 'success' && (needs.pypi-release-retention.result == 'success' || needs.pypi-release-retention.result == 'skipped') && (needs.publish-library-packages.result == 'success' || needs.publish-library-packages.result == 'skipped') && (needs.publish-agilab.result == 'success' || needs.publish-agilab.result == 'skipped') }}
    needs:
      - release-approval
      - release-plan
      - publish-library-packages
      - publish-agilab
      - pypi-provenance-evidence
      - pypi-release-retention
      - supply-chain-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-dist-*
          path: release-assets/distributions

      - name: Download supply-chain profile evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-release-evidence
          path: release-assets/supply-chain

      - name: Download PyPI provenance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-provenance-evidence
          path: release-assets/pypi-provenance

      - name: Assemble GitHub Release supply-chain assets
        run: |
          set -euxo pipefail
          mkdir -p github-release-assets
          find release-assets/distributions -type f \( \
            -name '*.whl' -o \
            -name '*.tar.gz' -o \
            -name '*-artifact-hashes.json' -o \
            -name '*-SHA256SUMS.txt' \
          \) -print -exec cp {} github-release-assets/ \;
          tar -czf github-release-assets/supply-chain-release-evidence.tar.gz \
            -C release-assets/supply-chain .
          tar -czf github-release-assets/pypi-provenance-evidence.tar.gz \
            -C release-assets/pypi-provenance .
          tar -czf github-release-assets/release-distribution-evidence.tar.gz \
            -C release-assets/distributions .
          (cd github-release-assets && shasum -a 256 * > SHA256SUMS.txt)

      - name: Attest GitHub Release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: github-release-assets/**

      - name: Upload supply-chain assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG#refs/tags/}"
          if [[ "$release_tag" != v* ]]; then
            release_tag="v${release_tag}"
          fi
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            notes=$'AGILAB release artifacts and supply-chain evidence.\n\nDataset payloads are published in separate datasets-* GitHub releases when present and linked from the release proof.'
            gh release create "$release_tag" \
              --title "AGILAB ${release_tag#v}" \
              --notes "$notes"
          fi
          gh release upload "$release_tag" github-release-assets/* --clobber

  pypi-release-retention:
    if: ${{ always() && needs.release-approval.result == 'success' && (github.event.inputs.include_existing_pypi || 'false') != 'true' && needs.release-plan.outputs.pypi_publish_selected == 'true' && needs.pypi-provenance-evidence.result == 'success' && (needs.publish-library-packages.result == 'success' || needs.publish-library-packages.result == 'skipped') && (needs.publish-agilab.result == 'success' || needs.publish-agilab.result == 'skipped') }}
    needs:
      - release-approval
      - release-plan
      - publish-library-packages
      - publish-agilab
      - pypi-provenance-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      PYPI_RETENTION_PACKAGES: ${{ needs.release-plan.outputs.provenance_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up locked PyPI web dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-pypi-web.txt

      - name: Delete older PyPI releases once package history exceeds configured threshold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_CONFIRM_READER_TOKEN: ${{ secrets.PYPI_CONFIRM_READER_TOKEN }}
          PYPI_RELEASE_PRUNE_USERNAME: ${{ secrets.PYPI_RELEASE_PRUNE_USERNAME }}
          PYPI_RELEASE_PRUNE_PASSWORD: ${{ secrets.PYPI_RELEASE_PRUNE_PASSWORD }}
          PYPI_RELEASE_PRUNE_TOTP_SECRET: ${{ secrets.PYPI_RELEASE_PRUNE_TOTP_SECRET }}
          PYPI_RELEASE_PRUNE_OTP: ${{ secrets.PYPI_RELEASE_PRUNE_OTP }}
        run: |
          set -euo pipefail
          test -n "${PYPI_CONFIRM_READER_TOKEN:-}" || {
            echo "PYPI_CONFIRM_READER_TOKEN secret is required to read the temporary PyPI confirmation variable." >&2
            exit 2
          }
          case "$PYPI_RETENTION_MIN_PUBLISHED_RELEASES" in
            ''|*[!0-9]*)
              echo "PYPI_RETENTION_MIN_PUBLISHED_RELEASES must be an integer >= 2." >&2
              exit 2
              ;;
          esac
          if [[ "$PYPI_RETENTION_MIN_PUBLISHED_RELEASES" -lt 2 ]]; then
            echo "PYPI_RETENTION_MIN_PUBLISHED_RELEASES must be an integer >= 2." >&2
            exit 2
          fi
          args=(
            --repo pypi
            --repo-root .
            --protect-versions-from-projects
            --min-published-releases "$PYPI_RETENTION_MIN_PUBLISHED_RELEASES"
            --verify-attempts 17
            --retry-delay 60
            --confirm-delete
            --direct-web-only
            --json
            --github-step-summary "$GITHUB_STEP_SUMMARY"
            --github-confirm-login-repository "$GITHUB_REPOSITORY"
            --github-confirm-login-variable "PYPI_CONFIRM_LOGIN_URL"
            --github-confirm-login-timeout 1800
            --github-confirm-login-poll-delay 5
            --github-token "$PYPI_CONFIRM_READER_TOKEN"
          )
          for package in ${PYPI_RETENTION_PACKAGES}; do
            args+=(--package "$package")
          done
          retention_log="$(mktemp)"
          if python tools/pypi_release_retention.py "${args[@]}" 2> >(tee "$retention_log" >&2); then
            rm -f "$retention_log"
          else
            if grep -Fq "PyPI redirected back to login while opening the release delete page after password/TOTP authentication." "$retention_log"; then
              echo "::warning title=PyPI release retention::Hosted-runner PyPI deletion needs a confirmed device; continuing release and leaving stale releases for manual cleanup."
            else
              rm -f "$retention_log"
              exit 1
            fi
            rm -f "$retention_log"
          fi

      - name: Clear temporary PyPI confirmation variable
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          from tools.pypi_release_retention import _cleanup_github_confirm_login_variable

          _cleanup_github_confirm_login_variable(
              repository=os.environ["GITHUB_REPOSITORY"],
              variable="PYPI_CONFIRM_LOGIN_URL",
              token=os.environ["GITHUB_TOKEN"],
          )
          PY

  publish-dataset-release-assets:
    if: ${{ !cancelled() && needs.release-approval.result == 'success' && needs.release-plan.result == 'success' && needs.release-audit.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs:
      - release-approval
      - test
      - release-plan
      - release-audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Build dataset release assets
        id: dataset-assets
        run: |
          python tools/dataset_release_assets.py \
            --repo-root . \
            --output-dir dataset-release-assets \
            --release-tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --fail-on-lfs-pointer
      - name: Check for existing dataset release
        id: dataset-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dataset_release_tag="${{ steps.dataset-assets.outputs.dataset_release_tag }}"
          if gh release view "$dataset_release_tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Dataset release $dataset_release_tag already exists; dataset payload is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest dataset release assets
        if: ${{ steps.dataset-assets.outputs.dataset_count != '0' && steps.dataset-release.outputs.exists != 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dataset-release-assets/**
      - name: Create dataset GitHub Release
        if: ${{ steps.dataset-assets.outputs.dataset_count != '0' && steps.dataset-release.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET_RELEASE_TAG: ${{ steps.dataset-assets.outputs.dataset_release_tag }}
          DATASET_MANIFEST_SHA256: ${{ steps.dataset-assets.outputs.dataset_manifest_sha256 }}
        run: |
          gh release create "$DATASET_RELEASE_TAG" dataset-release-assets/* \
            --title "AGILAB datasets ${DATASET_RELEASE_TAG#datasets-}" \
            --notes "Complete AGILAB dataset assets for manifest $DATASET_MANIFEST_SHA256. PyPI packages keep their packaged datasets; this separate release is for source checkouts and Git LFS pointer replacement. Code release: $RELEASE_TAG."

  sync-hf-space:
    if: ${{ always() && needs.release-approval.result == 'success' && needs.release-plan.outputs.umbrella_selected == 'true' && needs.publish-release-assets.result == 'success' }}
    needs:
      - release-approval
      - release-plan
      - publish-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hf_space_commit: ${{ steps.hf-sync.outputs.hf_space_commit }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      HF_SPACE_ID: ${{ vars.AGILAB_HF_SPACE_ID || 'jpmorard/agilab' }}
      HF_SPACE_PROFILE: ${{ vars.AGILAB_HF_SPACE_PROFILE || 'first-proof' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up locked HF release dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-hf-release.txt

      - name: Deploy and validate Hugging Face Space
        id: hf-sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "HF_TOKEN secret is required so every release syncs the public Hugging Face Space." >&2
            exit 2
          }
          python tools/hf_space_release_sync.py \
            --space "$HF_SPACE_ID" \
            --profile "$HF_SPACE_PROFILE" \
            --github-output "$GITHUB_OUTPUT" \
            --json

  # Keep the Hugging Face secret out of the job that can write GitHub refs,
  # releases, attestations, and workflow dispatches. The immutable HF commit is
  # the only value crossing this credential boundary.
  publish-release-proof:
    if: ${{ always() && needs.release-approval.result == 'success' && needs.sync-hf-space.result == 'success' }}
    needs:
      - release-approval
      - release-plan
      - sync-hf-space
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      PROVENANCE_PACKAGES: ${{ needs.release-plan.outputs.provenance_packages }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up locked release-proof dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-hf-release.txt

      - name: Prepare immutable release proof and review branch
        id: release-proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_SPACE_COMMIT: ${{ needs.sync-hf-space.outputs.hf_space_commit }}
        run: |
          set -euo pipefail
          hf_commit="${HF_SPACE_COMMIT}"
          if [[ ! "$hf_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Hugging Face commit: expected a 40-character lowercase SHA." >&2
            exit 2
          fi

          release_tag="${RELEASE_TAG#refs/tags/}"
          if [[ "$release_tag" != v* ]]; then
            release_tag="v${release_tag}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main
          release_branch="automation/release-evidence-${release_tag#v}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -C "$release_branch" origin/main

          RELEASE_TAG_NORMALIZED="$release_tag" python - <<'PY'
          import os
          from pathlib import Path

          from tools import pypi_publish

          release_tag = os.environ["RELEASE_TAG_NORMALIZED"]
          package_names = [name for name in os.environ.get("PROVENANCE_PACKAGES", "").split() if name]
          if not package_names:
              package_names = ["agilab"]
          chosen_version = pypi_publish.get_version_from_pyproject(Path("pyproject.toml"))
          pypi_publish.update_public_release_references_for_guard(
              release_tag,
              chosen_version,
              package_names,
          )
          PY

          python tools/release_proof_report.py \
            --refresh-from-local \
            --github-release-tag "$release_tag" \
            --github-release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}" \
            --hf-space-commit "$hf_commit" \
            --render \
            --check \
            --check-github-runs \
            --compact
          python tools/sync_docs_source.py \
            --target docs/source \
            --refresh-target-integrity-stamp \
            --quiet

          release_metadata_paths=(
            CHANGELOG.md
            badges/pypi-version-agilab.svg
            docs/source/data/release_proof.toml
            docs/source/release-proof.rst
            docs/.docs_source_mirror_stamp.json
          )

          release_version="${release_tag#v}"
          mkdir -p release-proof-assets
          cp docs/source/data/release_proof.toml \
            "release-proof-assets/agilab-${release_version}-release-proof.toml"
          cp docs/source/release-proof.rst \
            "release-proof-assets/agilab-${release_version}-release-proof.rst"
          (
            cd release-proof-assets
            shasum -a 256 \
              "agilab-${release_version}-release-proof.toml" \
              "agilab-${release_version}-release-proof.rst" \
              > "agilab-${release_version}-release-proof-SHA256SUMS.txt"
          )

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${release_branch}" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- "${release_metadata_paths[@]}"; then
            echo "Release proof already records HF Space commit ${hf_commit}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "${release_metadata_paths[@]}"
          git commit -m "docs(release): record HF Space sync"
          git push --set-upstream origin "$release_branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Attest immutable release proof assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-proof-assets/**

      - name: Upload immutable release proof assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NORMALIZED: ${{ steps.release-proof.outputs.release_tag }}
        run: |
          set -euo pipefail
          existing_dir="$(mktemp -d)"
          for asset in release-proof-assets/*; do
            name="$(basename "$asset")"
            if gh release view "$RELEASE_TAG_NORMALIZED" --json assets \
              --jq ".assets[] | select(.name == \"${name}\") | .name" | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG_NORMALIZED" \
                --pattern "$name" \
                --dir "$existing_dir"
              cmp "$asset" "$existing_dir/$name" || {
                echo "Existing immutable release asset differs: $name" >&2
                exit 1
              }
              echo "Reused identical immutable release asset: $name"
            else
              gh release upload "$RELEASE_TAG_NORMALIZED" "$asset"
            fi
          done

      - name: Open release evidence pull request and dispatch checks
        if: steps.release-proof.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release-proof.outputs.release_branch }}
          RELEASE_VERSION: ${{ steps.release-proof.outputs.release_version }}
        run: |
          set -euo pipefail
          cat > release-evidence-pr.md <<EOF
          ## Summary

          - record the final Hugging Face Space commit for release ${RELEASE_VERSION}
          - refresh the public release-proof manifest, rendered page, badge, and mirror integrity stamp
          - preserve review and required-check enforcement instead of writing directly to main

          ## Validation

          - release proof render and live GitHub-run checks passed in the publishing workflow
          - repository, root-test, and docs-source workflows are dispatched below for this exact commit

          ## Agent Metadata

          - Tokki version: not used
          - Agent/runtime: github-actions[bot]
          - Model: not used
          - Reasoning effort: not used
          - Fast mode: not used
          EOF
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "docs(release): record ${RELEASE_VERSION} evidence" \
            --body-file release-evidence-pr.md
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run root-test-suite.yml --ref "$RELEASE_BRANCH"
          gh workflow run docs-source-guard.yaml --ref "$RELEASE_BRANCH"
