name: pypi-release-retention

on:
  workflow_dispatch:
    inputs:
      delete_releases:
        description: "Plan only: exact package==version targets, one per line. No releases are deleted."
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up locked PyPI planning dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-pypi-web.txt

      - name: Produce exact cleanup plan without authentication or deletion
        env:
          DELETE_RELEASES: ${{ inputs.delete_releases }}
        run: |
          set -euo pipefail
          mkdir -p test-results/pypi-cleanup-plan
          python - <<'PY'
          import contextlib
          import os
          from pathlib import Path
          from tools.pypi_release_retention import main

          specs = os.environ["DELETE_RELEASES"].splitlines()
          if not specs or any(not spec.strip() for spec in specs):
              raise SystemExit("Provide exact package==version targets, one per line.")
          args = ["--repo-root", ".", "--dry-run", "--json"]
          for spec in specs:
              args.extend(["--delete-release", spec.strip()])
          output = Path("test-results/pypi-cleanup-plan/agilab_pypi_explicit_cleanup_plan.json")
          with output.open("w", encoding="utf-8") as handle, contextlib.redirect_stdout(handle):
              raise SystemExit(main(args))
          PY

      - name: Upload reviewable cleanup plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agilab-pypi-explicit-cleanup-plan
          path: test-results/pypi-cleanup-plan
          if-no-files-found: error
          retention-days: 90
