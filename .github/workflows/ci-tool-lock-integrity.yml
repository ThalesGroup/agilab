name: ci-tool-lock-integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-locks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Verify direct lock pins match source inputs
        run: |
          set -euo pipefail
          python tools/ci_tool_lock_integrity.py \
            --requirements-dir .github/requirements

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Clean-install CI lock auditor
        run: python tools/setup_locked_python_tools.py --requirements .github/requirements/ci-lock-audit.txt --github-env

      - name: Audit locked CI release tools
        run: |
          set -euo pipefail
          for requirements in \
            .github/requirements/ci-lock-audit.txt \
            .github/requirements/ci-publish.txt \
            .github/requirements/ci-pypi-web.txt \
            .github/requirements/ci-hf-release.txt \
            .github/requirements/ci-free-threaded-coverage.txt
          do
            pip-audit \
              --requirement "$requirements" \
              --no-deps \
              --disable-pip
          done

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Clean-install publishing lock
        run: python tools/setup_locked_python_tools.py --requirements .github/requirements/ci-publish.txt --github-env

      - name: Import-smoke publishing tools
        env:
          PIP_NO_INDEX: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import packaging
          import tomlkit
          import twine
          import yaml
          import tools.pypi_publish
          PY

      - name: Validate wheel metadata with publishing tools
        env:
          PIP_NO_INDEX: "1"
        run: python tools/testing/pypi_metadata_smoke.py

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Clean-install PyPI web lock
        run: python tools/setup_locked_python_tools.py --requirements .github/requirements/ci-pypi-web.txt --github-env

      - name: Import-smoke PyPI web tools
        env:
          PIP_NO_INDEX: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import packaging
          import requests
          import tools.pypi_pending_trusted_publisher
          import tools.pypi_release_retention
          PY
          python tools/pypi_release_retention.py --help >/dev/null

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Clean-install Hugging Face release lock
        run: python tools/setup_locked_python_tools.py --requirements .github/requirements/ci-hf-release.txt --github-env

      - name: Import-smoke Hugging Face release tools
        env:
          PIP_NO_INDEX: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import click
          import huggingface_hub
          import packaging
          import tomlkit
          import tools.hf_space_release_sync
          import tools.pypi_publish
          PY

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.7"
          prune-cache: true

      - name: Clean-install free-threaded coverage lock
        run: python tools/setup_locked_python_tools.py --requirements .github/requirements/ci-free-threaded-coverage.txt --github-env

      - name: Import-smoke coverage tooling
        env:
          PIP_NO_INDEX: "1"
        run: python -c "import coverage; assert coverage.__version__ == '7.16.1'"
