name: pypi-pending-trusted-publisher

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label for this workflow. Use ubuntu-latest or self-hosted."
        required: false
        type: choice
        default: "ubuntu-latest"
        options:
          - ubuntu-latest
          - self-hosted
      project_name:
        description: "PyPI project name to be created by the next trusted publish."
        required: true
      pypi_environment:
        description: "GitHub Actions environment used by pypi-publish.yaml for this PyPI project."
        required: true
      owner:
        description: "GitHub repository owner configured on PyPI."
        required: false
        default: "ThalesGroup"
      repository:
        description: "GitHub repository configured on PyPI."
        required: false
        default: "agilab"
      workflow_filename:
        description: "Publishing workflow filename configured on PyPI."
        required: false
        default: "pypi-publish.yaml"

permissions:
  contents: read
  actions: write

jobs:
  register:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up locked PyPI web dependencies
        uses: ./.github/actions/setup-locked-python-tools
        with:
          requirements: .github/requirements/ci-pypi-web.txt

      - name: Validate pending publisher inputs
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PYPI_ENVIRONMENT: ${{ inputs.pypi_environment }}
          PUBLISHER_OWNER: ${{ inputs.owner }}
          PUBLISHER_REPOSITORY: ${{ inputs.repository }}
          PUBLISHER_WORKFLOW: ${{ inputs.workflow_filename }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          validators = {
              "PROJECT_NAME": r"[A-Za-z0-9](?:[A-Za-z0-9._-]{0,198}[A-Za-z0-9])?",
              "PYPI_ENVIRONMENT": r"[A-Za-z0-9](?:[A-Za-z0-9._-]{0,253}[A-Za-z0-9])?",
              "PUBLISHER_OWNER": r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?",
              "PUBLISHER_REPOSITORY": r"[A-Za-z0-9](?:[A-Za-z0-9._-]{0,98}[A-Za-z0-9])?",
              "PUBLISHER_WORKFLOW": r"[A-Za-z0-9](?:[A-Za-z0-9._-]{0,248}[A-Za-z0-9])?\.ya?ml",
          }
          for name, pattern in validators.items():
              value = os.environ.get(name, "")
              if re.fullmatch(pattern, value) is None:
                  raise SystemExit(f"Invalid {name.lower().replace('_', ' ')} format")
          PY

      - name: Register pending trusted publisher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PYPI_ENVIRONMENT: ${{ inputs.pypi_environment }}
          PUBLISHER_OWNER: ${{ inputs.owner }}
          PUBLISHER_REPOSITORY: ${{ inputs.repository }}
          PUBLISHER_WORKFLOW: ${{ inputs.workflow_filename }}
          PYPI_CONFIRM_READER_TOKEN: ${{ secrets.PYPI_CONFIRM_READER_TOKEN }}
          PYPI_RELEASE_PRUNE_USERNAME: ${{ secrets.PYPI_RELEASE_PRUNE_USERNAME }}
          PYPI_RELEASE_PRUNE_PASSWORD: ${{ secrets.PYPI_RELEASE_PRUNE_PASSWORD }}
          PYPI_RELEASE_PRUNE_TOTP_SECRET: ${{ secrets.PYPI_RELEASE_PRUNE_TOTP_SECRET }}
          PYPI_RELEASE_PRUNE_OTP: ${{ secrets.PYPI_RELEASE_PRUNE_OTP }}
        run: |
          set -euo pipefail
          python tools/pypi_pending_trusted_publisher.py \
            --repo pypi \
            --project-name "$PROJECT_NAME" \
            --owner "$PUBLISHER_OWNER" \
            --repository "$PUBLISHER_REPOSITORY" \
            --workflow-filename "$PUBLISHER_WORKFLOW" \
            --environment "$PYPI_ENVIRONMENT" \
            --github-confirm-login-repository "$GITHUB_REPOSITORY" \
            --github-confirm-login-variable "PYPI_CONFIRM_LOGIN_URL" \
            --github-confirm-login-timeout 900 \
            --github-token "${PYPI_CONFIRM_READER_TOKEN:-$GITHUB_TOKEN}" \
            --github-confirm-login-cleanup-token "$GITHUB_TOKEN" \
            --delete-github-confirm-login-variable-after-use \
            --json \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
