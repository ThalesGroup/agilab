name: docs-source-guard

on:
  push:
    branches:
      - main
    paths:
      - "docs/source/**"
      - "docs/.docs_source_mirror_stamp.json"
      - "tools/sync_docs_source.py"
      - "tools/release_proof_report.py"
      - "test/test_sync_docs_source.py"
      - "test/test_release_proof_report.py"
      - ".github/workflows/docs-source-guard.yaml"
  pull_request:
    paths:
      - "docs/source/**"
      - "docs/.docs_source_mirror_stamp.json"
      - "tools/sync_docs_source.py"
      - "tools/release_proof_report.py"
      - "test/test_sync_docs_source.py"
      - "test/test_release_proof_report.py"
      - ".github/workflows/docs-source-guard.yaml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - name: Verify checked-in docs mirror integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv --preview-features extra-build-dependencies run python tools/sync_docs_source.py --verify-stamp --skip-missing-source --quiet
          uv --preview-features extra-build-dependencies run python tools/release_proof_report.py --check --check-github-runs --compact

      - name: Test docs/source guard tools
        run: |
          set -euo pipefail
          uv --preview-features extra-build-dependencies run pytest -q -o addopts='' test/test_sync_docs_source.py test/test_release_proof_report.py
