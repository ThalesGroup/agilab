# Five component uploads plus the final repository-wide upload.
# Keep both gates aligned with the uploads in .github/workflows/coverage.yml.
codecov:
  notify:
    after_n_builds: 6
comment:
  after_n_builds: 6
coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
      agi-env:
        target: 95%
        threshold: 0%
        flags: [agi-env]
        informational: false
        if_not_found: failure
      agi-node:
        target: 95%
        threshold: 0%
        flags: [agi-node]
        informational: false
        if_not_found: failure
      agi-cluster:
        target: 95%
        threshold: 0%
        flags: [agi-cluster]
        informational: false
        if_not_found: failure
      agi-core:
        target: 95%
        threshold: 0%
        flags: [agi-core]
        informational: false
        if_not_found: failure
      agi-gui:
        target: 95%
        threshold: 0%
        flags: [agi-gui]
        informational: false
        if_not_found: failure
      agi-web:
        target: 95%
        threshold: 0%
        flags: [agi-web]
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 75%
        threshold: 5%
flags:
  agi-gui:
    # App-layer surface: Python pages, app bundles, and orchestration/pipeline helpers.
    # The README "agilab" badge is the repo-wide aggregate; this flag isolates the GUI/app layer.
    paths:
      - src/agilab/pages
      - src/agilab/apps-pages
      - src/agilab/orchestrate_cluster.py
      - src/agilab/orchestrate_distribution.py
      - src/agilab/orchestrate_execute.py
      - src/agilab/orchestrate_services.py
      - src/agilab/orchestrate_support.py
      - src/agilab/pipeline_ai.py
      - src/agilab/pipeline_editor.py
      - src/agilab/pipeline_lab.py
      - src/agilab/pipeline_openai.py
      - src/agilab/pipeline_runtime.py
      - src/agilab/pipeline_sidebar.py
      - src/agilab/pipeline_steps.py
      - src/agilab/pipeline_views.py
  agi-web:
    paths:
      - src/agilab/lib/agi-web
  agi-env:
    paths:
      - src/agilab/core/agi-env
  agi-node:
    paths:
      - src/agilab/core/agi-node
  agi-cluster:
    paths:
      - src/agilab/core/agi-cluster
  agi-core:
    # Umbrella core stack: env + node + cluster + the thin meta-package.
    paths:
      - src/agilab/core/agi-env
      - src/agilab/core/agi-node
      - src/agilab/core/agi-cluster
      - src/agilab/core/agi-core
ignore:
  - "src/agilab/demos/resources/*/tests.py"
  - "**/test/**"
  - "**/tests/**"
  - "**/sitecustomize.py"
  - "src/agilab/main_page.py"
  - "src/agilab/agi_codex.py"
  - "src/agilab/apps/install.py"
  - "src/agilab/lab_run.py"
  - "src/agilab/apps/__init__.py"
  - "src/agilab/core/agi-cluster/build.py"
  - "src/agilab/core/gen_app_script.py"
  - "src/agilab/core/tools/test_kill.py"
